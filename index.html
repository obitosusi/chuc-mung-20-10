<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>20/10 · Gửi Trang</title>
<meta name="theme-color" content="#ffd6e3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#ffd6e3; --berry:#e8456f; --lilac:#cdbdf5; --butter:#fff0b3; --plum:#3d2145; --mist:#fff7fa;
  --script:'Dancing Script','Segoe Script',cursive; --body:'Be Vietnam Pro',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--body);color:var(--plum);background:var(--mist);line-height:1.7;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(160deg,#ffe9f0 0%,#f3e9ff 55%,#fff3d6 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;background:var(--rose);top:-12vmax;left:-10vmax}
.bg i:nth-child(2){width:40vmax;height:40vmax;background:var(--lilac);bottom:-14vmax;right:-8vmax;animation-delay:-6s}
.bg i:nth-child(3){width:26vmax;height:26vmax;background:var(--butter);top:40%;left:55%;animation-delay:-11s}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.12)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

/* ---------- Intro (gift) ---------- */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;
  background:linear-gradient(160deg,#ffe3ec,#ead9ff);transition:opacity .9s ease,visibility .9s}
#intro.gone{opacity:0;visibility:hidden}
.gift{border:0;background:none;cursor:pointer;font:inherit;color:inherit;display:grid;gap:18px;justify-items:center}
.envelope{position:relative;width:min(78vw,300px);aspect-ratio:3/2;background:#fff;border-radius:14px;
  box-shadow:0 24px 50px -18px rgba(232,69,111,.55);animation:bob 3.2s ease-in-out infinite}
.envelope::before{content:"";position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(to top right,transparent 49.5%,#ffc2d6 50%) left/50% 100% no-repeat,
             linear-gradient(to top left,transparent 49.5%,#ffc2d6 50%) right/50% 100% no-repeat}
.envelope .flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(#ff9ebb,#ff86aa);
  clip-path:polygon(0 0,100% 0,50% 100%);border-radius:14px 14px 0 0;transform-origin:top;transition:transform .7s}
.envelope .heart{position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);font-size:44px;z-index:2;animation:beat 1.4s infinite}
.gift:hover .flap{transform:rotateX(180deg)}
.intro-title{font-family:var(--script);font-size:clamp(2rem,8vw,3rem);color:var(--berry);line-height:1.1}
.intro-sub{font-size:.95rem;opacity:.8}
.pill{display:inline-block;padding:12px 28px;border-radius:999px;background:var(--berry);color:#fff;font-weight:500;
  box-shadow:0 10px 24px -8px rgba(232,69,111,.7);transition:transform .2s}
.gift:hover .pill{transform:scale(1.06)}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1deg)}}
@keyframes beat{50%{transform:translate(-50%,-30%) scale(1.2)}}

/* ---------- Hero ---------- */
section{padding:clamp(56px,10vw,110px) 20px;max-width:1100px;margin:0 auto}
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;gap:10px;padding-top:40px}
.arch{position:relative;width:min(64vw,260px);aspect-ratio:3/4;border-radius:999px 999px 28px 28px;overflow:hidden;
  border:6px solid #fff;box-shadow:0 30px 60px -22px rgba(61,33,69,.45);margin:0 auto 8px}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.ring{position:absolute;inset:-14px;border-radius:999px 999px 36px 36px;border:2px dashed var(--berry);opacity:.5;animation:spin 40s linear infinite}
.hero-wrap{position:relative;display:inline-block}
.hero-wrap .ring{inset:-16px}
@keyframes spin{to{transform:rotate(360deg)}}
.date{font-family:var(--script);font-size:clamp(3.4rem,17vw,7rem);line-height:1;margin:6px 0 0;color:var(--berry);
  text-shadow:0 4px 0 #fff,0 14px 30px rgba(232,69,111,.3)}
.date small{display:block;font-size:.34em;color:var(--plum);text-shadow:none;margin-top:6px}
.name{font-size:clamp(1.1rem,4vw,1.5rem);font-weight:300;letter-spacing:.04em}
.name b{font-weight:500;color:var(--berry)}
.hint{margin-top:18px;font-size:.85rem;opacity:.65;animation:nudge 2s infinite}
@keyframes nudge{50%{transform:translateY(6px)}}
.hero.play .arch{animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) both}
.hero.play .date{animation:pop 1.1s .25s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(30px)}}

/* ---------- Gallery ---------- */
h2{font-family:var(--script);font-size:clamp(2.2rem,8vw,3.4rem);text-align:center;margin:0 0 6px;color:var(--berry)}
.lead{text-align:center;margin:0 auto 40px;max-width:34ch;font-weight:300}
.wall{columns:2;column-gap:16px}
@media(min-width:760px){.wall{columns:3;column-gap:26px}}
figure.polaroid{break-inside:avoid;margin:0 0 22px;padding:10px 10px 12px;background:#fff;border-radius:6px;
  box-shadow:0 14px 30px -14px rgba(61,33,69,.4);transform:rotate(var(--r,0deg));cursor:zoom-in;
  transition:transform .35s cubic-bezier(.2,1.3,.4,1),box-shadow .35s;opacity:0;translate:0 40px}
figure.polaroid.in{opacity:1;translate:0 0;transition:opacity .8s,translate .8s,transform .35s cubic-bezier(.2,1.3,.4,1),box-shadow .35s}
figure.polaroid:nth-child(3n+1){--r:-2.2deg}figure.polaroid:nth-child(3n+2){--r:1.6deg}figure.polaroid:nth-child(3n){--r:-.8deg}
figure.polaroid:hover{transform:rotate(0) scale(1.05);box-shadow:0 26px 44px -16px rgba(232,69,111,.5);z-index:2;position:relative}
figure.polaroid img{display:block;width:100%;height:auto;border-radius:3px}
figure.polaroid figcaption{font-family:var(--script);font-size:1.25rem;text-align:center;padding-top:8px;color:var(--plum)}
figure.polaroid::after{content:"";position:absolute;top:-10px;left:50%;width:64px;height:20px;margin-left:-32px;
  background:rgba(255,214,227,.85);transform:rotate(-3deg);border-radius:2px}
figure.polaroid{position:relative}

/* ---------- Letter ---------- */
.letter{background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-radius:28px;padding:clamp(26px,6vw,56px);
  box-shadow:0 30px 60px -30px rgba(61,33,69,.35);max-width:680px;margin:0 auto;position:relative}
.letter::before{content:"🌷";position:absolute;top:-22px;right:28px;font-size:44px;animation:sway 4s ease-in-out infinite;transform-origin:bottom}
@keyframes sway{50%{transform:rotate(10deg)}}
.letter h3{font-family:var(--script);font-size:2rem;margin:0 0 10px;color:var(--berry)}
#typed{white-space:pre-wrap;min-height:15em;font-size:1.02rem}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--berry);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sign{font-family:var(--script);font-size:1.7rem;text-align:right;margin-top:14px;color:var(--berry)}
footer{text-align:center;padding:50px 20px 110px;font-size:.9rem;opacity:.7}

/* ---------- Player ---------- */
.player{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:none;align-items:center;gap:10px;
  padding:8px 18px 8px 8px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  box-shadow:0 12px 30px -10px rgba(61,33,69,.45);border:0;font:inherit;color:var(--plum);cursor:pointer;max-width:calc(100vw - 28px)}
.player.show{display:flex}
.disc{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:15px;
  background:radial-gradient(circle,#fff 0 8%,var(--berry) 9% 38%,#ff9ebb 39% 100%);animation:spin 5s linear infinite;animation-play-state:paused}
.player.on .disc{animation-play-state:running}
.song{font-size:.78rem;line-height:1.25;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song b{display:block;font-weight:500}

/* ---------- Lightbox ---------- */
#lb{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(61,33,69,.82);backdrop-filter:blur(6px);padding:20px}
#lb.open{display:grid}
#lb img{max-width:92vw;max-height:84vh;border-radius:10px;border:6px solid #fff;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.9);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;color:var(--plum)}
#lb .x{top:calc(16px + env(safe-area-inset-top,0px));right:16px}#lb .p{left:12px}#lb .n{right:12px}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--plum);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.burst{position:fixed;z-index:40;pointer-events:none;font-size:22px;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translate(var(--dx),-140px) scale(1.3);opacity:0}}

@media(prefers-color-scheme:dark){:root{--mist:#2a1830;--plum:#ffeaf2}
  .bg{background:linear-gradient(160deg,#3a1d3f,#251a45 55%,#33261f)}
  figure.polaroid,.letter,.player{background:rgba(58,32,66,.9)}figure.polaroid figcaption{color:#ffeaf2}
  #intro{background:linear-gradient(160deg,#3a1d3f,#2a1b4a)}.envelope{background:#4a2b55}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
  figure.polaroid{opacity:1;translate:0 0}}
</style>
</head>
<body class="locked">
<div class="bg"><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>

<!-- Intro -->
<div id="intro">
  <button class="gift" id="open" aria-label="Mở quà">
    <div class="envelope"><div class="flap"></div><div class="heart">💌</div></div>

</div>

<main>

    <div class="wall">

      <figure class="polaroid"><img src="img/2.jpg" alt="Ngôi sao nhỏ trên tay" loading="lazy"><figcaption>Ngôi sao nhỏ trên tay</figcaption></figure>

  <section id="us">
    <h2>Hai đứa mình</h2>
    <p class="lead">Những chuyến đi nhỏ, nhưng anh nhớ từng chuyến.</p>
    <div class="wall">

</main>
<footer>Anh làm tặng em bằng cả tấm lòng · 20/10/2026</footer>

<button class="player" id="player" aria-label="Bật/tắt nhạc">
  <span class="disc">♪</span>
  <span class="song"><b>Và thế giới đã mất đi một người cô đơn</b>Chạm để dừng / phát</span>
</button>
<audio id="bgm" src="music/song.mp3" loop preload="auto"></audio>

<div id="lb" role="dialog" aria-modal="true"><button class="x" aria-label="Đóng">✕</button><button class="p" aria-label="Ảnh trước">‹</button><img alt=""><button class="n" aria-label="Ảnh sau">›</button></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const bgm=$('#bgm'), player=$('#player'), toast=$('#toast');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function say(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3200)}

/* ---- Music ---- */
function sync(){player.classList.toggle('on',!bgm.paused)}
function play(){bgm.play().then(sync).catch(()=>say('Chưa tìm thấy file nhạc: hãy đặt song.mp3 vào thư mục music/'))}
bgm.addEventListener('error',()=>say('Chưa tìm thấy file nhạc: hãy đặt song.mp3 vào thư mục music/'));
player.onclick=()=>{bgm.paused?play():(bgm.pause(),sync())};

/* ---- Open gift ---- */
$('#open').onclick=()=>{
  play(); $('#intro').classList.add('gone'); document.body.classList.remove('locked');
  $('#hero').classList.add('play'); player.classList.add('show'); burst(innerWidth/2,innerHeight/2,16);
  setTimeout(()=>$('#intro').remove(),1000);
};

/* ---- Petals + hearts canvas ---- */
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,parts=[];
function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',size);size();
const cols=['#ffb3cb','#ff8fb3','#ffd6e3','#e3d4ff','#fff0b3'];
function mk(init){const d=devicePixelRatio;return{x:Math.random()*W,y:init?Math.random()*H:-30*d,s:(7+Math.random()*10)*d,
  vy:(.5+Math.random()*1.1)*d,vx:(Math.random()-.5)*.6*d,a:Math.random()*6.28,va:(Math.random()-.5)*.04,
  c:cols[Math.random()*cols.length|0],heart:Math.random()<.25,ph:Math.random()*6}}
if(!reduce){for(let i=0;i<38;i++)parts.push(mk(true))}
function heart(x,y,s){cx.beginPath();cx.moveTo(x,y+s*.3);cx.bezierCurveTo(x-s,y-s*.6,x-s*.4,y-s*1.1,x,y-s*.4);
  cx.bezierCurveTo(x+s*.4,y-s*1.1,x+s,y-s*.6,x,y+s*.3);cx.fill()}
function loop(t){cx.clearRect(0,0,W,H);
  for(const p of parts){p.y+=p.vy;p.x+=p.vx+Math.sin(t/900+p.ph)*.5*devicePixelRatio;p.a+=p.va;
    if(p.y>H+30)Object.assign(p,mk(false));
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=.85;
    if(p.heart)heart(0,0,p.s*.7);else{cx.beginPath();cx.ellipse(0,0,p.s*.45,p.s,0,0,6.28);cx.fill()}
    cx.restore()}
  requestAnimationFrame(loop)}
if(!reduce)requestAnimationFrame(loop);

/* ---- Tap hearts ---- */
function burst(x,y,n=5){if(reduce)return;const e=['💗','🌸','✨','💖','🌷'];
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='burst';s.textContent=e[Math.random()*e.length|0];
    s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(Math.random()*160-80)+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1400)}}
addEventListener('pointerdown',e=>{if(!e.target.closest('#lb,.player,#intro'))burst(e.clientX,e.clientY)});

/* ---- Gallery reveal + lightbox ---- */
const figs=$$('.polaroid');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
figs.forEach((f,i)=>{f.style.transitionDelay=(i%3)*.12+'s';io.observe(f)});
const lb=$('#lb'),lbi=$('#lb img');let cur=0;
function show(i){cur=(i+figs.length)%figs.length;lbi.src=figs[cur].querySelector('img').src;lb.classList.add('open')}
figs.forEach((f,i)=>f.onclick=()=>show(i));
$('#lb .x').onclick=()=>lb.classList.remove('open');
$('#lb .p').onclick=()=>show(cur-1);$('#lb .n').onclick=()=>show(cur+1);
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
/* gentle 3D tilt on desktop */
figs.forEach(f=>{f.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=f.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  f.style.transform=`perspective(700px) rotateY(${x*10}deg) rotateX(${-y*10}deg) scale(1.05)`});
  f.addEventListener('pointerleave',()=>f.style.transform='')});

/* ---- Typewriter letter ---- */
const letter=`Hôm nay là 20/10, ngày cả thế giới nói lời cảm ơn với những cô gái tuyệt vời. Còn anh muốn cảm ơn riêng em.

Cảm ơn em vì đã xuất hiện. Vì những buổi đi chơi chẳng cần gì to tát, chỉ cần có em ngồi sau xe, đội chiếc mũ kính ngố ngố, cười một cái là anh hết mệt.

Anh biết có những ngày em cũng mệt, chỉ muốn nằm im một chỗ. Những hôm đó em cứ nghỉ nhé, anh ở ngay đây.

Bài hát này anh chọn vì có lúc anh cũng từng thấy cô đơn. Nhưng từ ngày có em, thế giới của anh đã bớt đi một người cô đơn rồi.

Chúc em 20/10 thật rạng rỡ. Anh thương em nhiều hơn những gì anh nói được.`;
let started=false;
new IntersectionObserver((es,o)=>{if(es[0].isIntersecting&&!started){started=true;o.disconnect();
  const el=$('#typed');if(reduce){el.textContent=letter;return}let i=0;
  (function t(){el.textContent=letter.slice(0,++i);if(i<letter.length)setTimeout(t,/[.,:\n]/.test(letter[i-1])?160:34)})()}},{threshold:.4}).observe($('.letter'));
</script>
